name: Prepare and publish verified workspace release

on:
  pull_request:
    paths:
      - .github/workflows/publish-workspace.yml
      - scripts/workspace-release.mjs
      - scripts/workspace-packages.mjs
      - test/workspace-release.test.mjs
  workflow_dispatch:
    inputs:
      version:
        description: Exact synchronized SDK version already merged into main
        required: true
        type: string
      publish:
        description: Publish verified tarballs (false only prepares artifacts)
        required: true
        default: false
        type: boolean
      authentication:
        description: One-time bootstrap token for 0.0.1-alpha; OIDC for subsequent releases
        required: true
        default: oidc
        type: choice
        options:
          - oidc
          - bootstrap-token

permissions:
  contents: read

concurrency:
  group: workspace-release-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - run: node --test test/workspace-release.test.mjs

  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'vp-tw/dirwell'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies
      - run: pnpm check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
      - run: pnpm test:compat
      - run: pnpm build
      - run: pnpm site:build
      - run: pnpm verify:package
      - run: node scripts/workspace-release.mjs prepare
      - run: node scripts/verify-workspace-consumer.mjs .workspace-release
      - run: node scripts/verify-readme-quickstarts.mjs .workspace-release
      - run: node scripts/workspace-release.mjs verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-browser-failure
          path: .playwright-results/
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: verified-workspace
          path: .workspace-release/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
          registry-url: ${{ inputs.authentication == 'bootstrap-token' && 'https://registry.npmjs.org' || '' }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-workspace
          path: .workspace-release/
      - name: Publish with explicit authentication and provenance
        env:
          DIRWELL_PUBLISH_AUTH: ${{ inputs.authentication }}
          NODE_AUTH_TOKEN: ${{ inputs.authentication == 'bootstrap-token' && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
        run: node scripts/workspace-release.mjs publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-registry-proof
          path: .workspace-release/registry-proof.json
          include-hidden-files: true
          if-no-files-found: warn

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-workspace
          path: .workspace-release/
      - run: node scripts/workspace-release.mjs readback
      - run: node scripts/verify-workspace-registry.mjs

  release:
    needs: verify-published
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Bind the family release to the verified source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          import { releaseNotes } from './scripts/alpha-release.mjs';
          await writeFile('workspace-release-notes.md', releaseNotes(await readFile('WORKSPACE_CHANGELOG.md', 'utf8'), process.env.RELEASE_VERSION));
          JS
          tag="@dirwell/workspace@$RELEASE_VERSION"
          prerelease=false
          case "$RELEASE_VERSION" in *-alpha*) prerelease=true ;; esac
          if ! gh release view "$tag"; then
            if test "$prerelease" = true; then
              gh release create "$tag" --target "$GITHUB_SHA" --title "Dirwell SDK $RELEASE_VERSION" --prerelease --notes-file workspace-release-notes.md
            else
              gh release create "$tag" --target "$GITHUB_SHA" --title "Dirwell SDK $RELEASE_VERSION" --notes-file workspace-release-notes.md
            fi
          fi
          test "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" = "$prerelease"
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
