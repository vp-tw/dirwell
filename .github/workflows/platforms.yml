name: Platform consumer verification

on:
  pull_request:
    paths:
      - .github/workflows/platforms.yml
      - scripts/verify-platform.mjs
      - scripts/platform-consumer.mjs
      - scripts/workspace-packages.mjs
      - scripts/pack-workspace.mjs
      - scripts/verify-workspace-consumer.mjs
      - scripts/workspace-consumer.mjs
      - scripts/build-framework-theme.mjs
      - packages/**
      - pnpm-workspace.yaml
      - src/**
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: mkdir package-artifact && npm pack --pack-destination package-artifact
      - run: node scripts/pack-workspace.mjs workspace-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: platform-package
          path: package-artifact/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-package
          path: workspace-artifact/*.tgz
  consumer:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24.1.0", "26"]
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            windows-latest,
            windows-11-arm,
            macos-26,
            macos-26-intel,
          ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: platform-package
          path: package-artifact
      - uses: actions/download-artifact@v4
        with:
          name: workspace-package
          path: workspace-artifact
      - name: Test the installed tarball
        env:
          PLATFORM_PROOF_NAME: ${{ matrix.os }}-node-${{ matrix.node }}
        shell: bash
        run: node scripts/verify-platform.mjs package-artifact/*.tgz
      - name: Test the installed workspace tarballs
        env:
          PLATFORM_PROOF_NAME: ${{ matrix.os }}-node-${{ matrix.node }}
        run: node scripts/verify-workspace-consumer.mjs workspace-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: platform-proof-${{ matrix.os }}-node-${{ matrix.node }}
          path: .platform-proof/*.json
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-platform-proof-${{ matrix.os }}-node-${{ matrix.node }}
          path: .workspace-platform-proof/*.json
          include-hidden-files: true
  compare-images:
    needs: consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-proof-*
          path: proofs
          merge-multiple: true
      - name: Compare bundled-font image output
        run: |
          node --input-type=module -e 'import{readFile,readdir}from"node:fs/promises";import assert from"node:assert/strict";const files=await readdir("proofs");assert.equal(files.length,18);const reports=await Promise.all(files.map(async f=>JSON.parse(await readFile("proofs/"+f,"utf8"))));for(const report of reports)assert.deepEqual(report.images,reports[0].images);console.log("All three share images are byte-identical across eighteen Node/OS/architecture combinations.");'
