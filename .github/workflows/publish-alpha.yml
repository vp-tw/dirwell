name: Publish verified package with OIDC

on:
  pull_request:
    paths:
      - .github/workflows/publish-alpha.yml
      - scripts/alpha-release.mjs
      - test/alpha-release.test.mjs
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version already merged into main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-alpha-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate-release:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - run: node --test test/alpha-release.test.mjs

  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'vp-tw/dirwell'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies
      - run: pnpm check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
      - run: pnpm test:compat
      - run: pnpm build
      - run: pnpm site:build
      - run: pnpm verify:package
      - run: node scripts/alpha-release.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: verified-package
          path: .release-artifact/
          if-no-files-found: error
          include-hidden-files: true

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-package
          path: .release-artifact/
      - run: node scripts/alpha-release.mjs publish
      - uses: actions/upload-artifact@v4
        with:
          name: registry-proof
          path: .release-artifact/registry-proof.json
          include-hidden-files: true

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-package
          path: .release-artifact/
      - run: node scripts/alpha-release.mjs readback
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:package --registry
      - name: Verify registry signatures and provenance cryptographically
        run: |
          consumer=$(mktemp -d)
          trap 'rm -rf "$consumer"' EXIT
          cd "$consumer"
          npm init --yes
          npm install --ignore-scripts "@vp-tw/dirwell@$RELEASE_VERSION"
          npm audit signatures

  release:
    needs: verify-published
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Create verified Git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="@vp-tw/dirwell@$RELEASE_VERSION"
          prerelease=$(node --input-type=module -e 'import {releaseTag} from "./scripts/alpha-release.mjs"; console.log(releaseTag(process.env.RELEASE_VERSION) === "alpha")')
          node --input-type=module -e 'import {readFile,writeFile} from "node:fs/promises"; import {releaseNotes} from "./scripts/alpha-release.mjs"; await writeFile("/tmp/dirwell-release-notes.md", releaseNotes(await readFile("CHANGELOG.md", "utf8"), process.env.RELEASE_VERSION))'
          if ! gh release view "$tag"; then
            args=(--target "$GITHUB_SHA" --title "Dirwell $RELEASE_VERSION" --notes-file /tmp/dirwell-release-notes.md)
            if [ "$prerelease" = true ]; then args+=(--prerelease); fi
            gh release create "$tag" "${args[@]}"
          fi
          test "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" = "$prerelease"
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
