name: Check, test, and build

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:package
      - run: pnpm docs:build

  shared-cache-example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.12.0, 26]
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: examples/shared-cache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: examples/shared-cache/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
      - run: npm test
        env:
          REDIS_URL: redis://127.0.0.1:6379
